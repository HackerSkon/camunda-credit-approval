spring.application.name=credit

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/camunda_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Bedafama25
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Camunda
camunda.identity.type=none

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.io.camunda=INFO
logging.level.org.hibernate.SQL=DEBUG

zeebe.client.broker.gateway-address=localhost:26500
zeebe.client.security.plaintext=true
